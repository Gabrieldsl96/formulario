{% extends 'base.html' %}

{% block title %}Recuperar Senha — Formulário{% endblock %}

{% block body %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8 text-center">
            <h1 class="text-2xl font-bold text-gray-900 mb-2">Recuperar senha</h1>
            <p class="text-sm text-gray-500 mb-6">Entre em contato com o administrador do sistema.</p>
            <a href="{% url 'accounts:login' %}"
               class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white
                      font-semibold py-2.5 px-5 rounded-xl transition-all duration-200 text-sm">
                Voltar ao login
            </a>
        </div>
    </div>
</div>
{% endblock %}
